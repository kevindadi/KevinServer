[package]
name = "KevinServer"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "server"
path = "src/server.rs"

[dependencies]
tonic = "0.9"
prost = "0.11"
tokio = { version = "1.0", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
async-trait = "0.1"
tempfile = "3.2"  # 用于创建临时文件
which = "4.2"     # 用于查找命令路径

[build-dependencies]
tonic-build = "0.9"