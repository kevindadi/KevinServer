syntax = "proto3";
package rustmir;

service RustMirService {
    // 原来的方法
    rpc GetMir (RustSourceRequest) returns (MirResponse);
    // 新增：列出目录下所有文件名
    rpc ListFiles (ListFilesRequest) returns (ListFilesResponse);
    // 新增：执行 pn 分析，返回 SVG 内容及其它信息
    rpc RunPnAnalysis (PnAnalysisRequest) returns (PnAnalysisResponse);
    rpc GetFileContent (FileContentRequest) returns (FileContentResponse);
}

message RustSourceRequest {
    string source_code = 1;
}

message MirResponse {
    bool success = 1;
    string content = 2;
}

message ListFilesRequest {
    // 要读取的目录路径
    string dir_path = 1;
}

message ListFilesResponse {
    // 文件名列表
    repeated string filenames = 1;
}

message PnAnalysisRequest {
    // 源代码内容
    string source_code = 1;
    // 模式参数（例如 pn 命令中的选项）
    string mode = 2;
}

message PnAnalysisResponse {
    // 生成的 SVG 内容
    string graph_content = 1;
    // pn 命令的输出（可能包含调试信息）
    string output = 2;
    // pn 命令的错误输出
    string error = 3;
}

message FileContentRequest {
    string file_path = 1;
}

message FileContentResponse {
    string content = 1;
}